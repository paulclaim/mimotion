name: Random Cron
on:
  workflow_run:
    workflows: ["刷步数"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimotion-repository-writer
  cancel-in-progress: false
  queue: max

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.PAT || github.token }}
          ref: ${{ github.event.repository.default_branch }}
      - name: random cron
        env:
          CRON_HOURS: ${{ vars.CRON_HOURS }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source cron_convert.sh
          persist_execute_log "$EVENT_NAME" "$CRON_HOURS"
          current=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          bash .github/scripts/persist_changes.sh "[$current] random cron trigger by $EVENT_NAME" .github/workflows/run.yml cron_change_time

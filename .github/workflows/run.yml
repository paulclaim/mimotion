name: 刷步数

on:
  schedule:
    - cron: '14 12,13,14,15 * * *'
  workflow_dispatch:
    inputs:
      target_step:
        description: '本次当日目标总步数（留空使用配置范围，低于已有步数时跳过）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mimotion-repository-writer
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.PAT || github.token }}
          # 队列等待期间分支可能前进，按分支名获取最新代码和凭据。
          ref: ${{ github.ref_name }}

      - name: 初始化Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: 开始
        id: run
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          TARGET_STEP: ${{ inputs.target_step }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        if: ${{ !cancelled() && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/persist_changes.sh "persist tokens trigger by $EVENT_NAME" encrypted_tokens.data
